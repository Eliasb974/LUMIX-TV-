        .hora{font-size:15px}
        body.fullscreen-activo .barra-estado{display:none}
        .menu-lateral{width:140px;padding:80px 0 20px 30px;display:flex;flex-direction:column;gap:18px;z-index:10}

        .opcion-menu.activo{color:var(--texto-activo);font-weight:500}
        body.fullscreen-activo .menu-lateral{display:none}
        .area-central{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;cursor:pointer}
        body.fullscreen-activo .area-central{width:100vw;height:100vh;flex:none}
        video{width:100%;height:100%;object-fit:contain;display:none;background:#000;pointer-events:none}
        body.fullscreen-activo video{object-fit:cover}

        .lista-canales{width:220px;border-left:1px solid var(--borde-lista);padding:70px 15px 20px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;z-index:10;background:var(--panel-fondo)}

        .panel-encabezado,.panel-busqueda{display:none}

        .subtitulo-canal{font-size:12px;color:#7A6296}
        .chevron-canal{display:none;color:#7A6296;font-size:16px;flex-shrink:0}
        body.fullscreen-activo .chevron-canal{display:block}
        .watermark{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);color:#fff;font-size:18px;font-weight:500;text-shadow:2px 2px 4px rgba(0,0,0,.9);opacity:.45;pointer-events:none;z-index:10;white-space:nowrap;font-family:Arial,sans-serif}
        .opcion-menu:focus,.btn-pantalla:focus{outline:3px solid var(--carga-azul);outline-offset:2px;background:rgba(255,255,255,.06)}
        .tarjeta-canal:focus{outline:3px solid var(--carga-azul);outline-offset:-3px}
        :focus{outline-color:var(--carga-azul)}
        :focus:not(:focus-visible){outline:none}
        :focus-visible{outline:3px solid var(--carga-azul)}
        @media screen and (min-width:1280px){.menu-lateral{width:180px;padding-left:40px;gap:26px}.opcion-menu{font-size:22px}.lista-canales{width:280px;padding-top:90px;gap:16px}body.fullscreen-activo .lista-canales{width:380px}.nombre-canal{font-size:19px}.numero-canal{font-size:16px;width:30px}.logo-canal{width:52px;height:52px;font-size:15px}.barra-estado{font-size:20px;gap:24px}.hora{font-size:18px}.btn-pantalla{font-size:26px;bottom:24px;right:24px}.tarjeta-canal{padding:14px}}
        @media (hover:none){.tarjeta-canal:hover{background:transparent;border-color:transparent}}

        let CONFIG_GLOBAL = {
            token: CONFIGURACION.configuracion.token,
            baseUrl: CONFIGURACION.configuracion.baseUrl,
            proxy: CONFIGURACION.configuracion.proxy,
            headers: CONFIGURACION.configuracion.headers
        };
        
        let CHANNELS = Object.keys(CONFIGURACION.canales).map(clave => {
            const c = CONFIGURACION.canales[clave];
            return {
                id: clave,
                num: c.num,
                name: c.nombre,
                logo: c.logo,
                tipo: c.tipo,
                url: c.url || null,
                ruta: c.ruta || null,
                drmKeyUrl: c.drmKeyUrl || null
            };
        });

        const video = document.getElementById('reproductor');
        const sinSenal = document.getElementById('sin-senal');
        const listaScrollEl = document.getElementById('lista-canales-scroll');
        const listaCanalesEl = document.getElementById('lista-canales');
        const areaCentral = document.getElementById('area-central');
        const inputBusqueda = document.getElementById('input-busqueda');
        let shakaPlayer = null;
        let reproduciendoOk = false;
        let canalActual = null;

        async function obtenerClavesDRM(drmUrl) {
            if (!drmUrl) return null;
            try {
                const resp = await fetch(drmUrl);
                return await resp.json();
            } catch (err) {
                console.error("Error DRM:", err);
                return null;
            }
        }
        function base64AHex(str) {
            return atob(str).split('').map(c => c.charCodeAt(0).toString(16).padStart(2, '0')).join('');
        }

        async function reproducirCanalDASH(canal) {
            const URL_COMPLETA = CONFIG_GLOBAL.baseUrl + CONFIG_GLOBAL.token + canal.ruta;
            console.log("📡 DASH:", canal.name, "→", URL_COMPLETA);
            reproduciendoOk = false;
            canalActual = canal;
            mostrarSinSenal();

            if (shakaPlayer) { shakaPlayer.unload(); shakaPlayer.destroy(); shakaPlayer = null; }
            if (!shaka.Player.isBrowserSupported()) { alert("❌ Navegador no compatible con DASH"); return; }
            
            shaka.polyfill.installAll();
            shakaPlayer = new shaka.Player(video);
            shakaPlayer.addEventListener('error', (e) => { console.error("Error Shaka:", e.detail); mostrarSinSenal(); });

            try {
                shakaPlayer.configure({
                    streaming: { bufferingGoal: 15, rebufferingGoal: 2 },
                    network: { requestHeaders: CONFIG_GLOBAL.headers }
                });

                if (canal.drmKeyUrl) {
                    const claves = await obtenerClavesDRM(canal.drmKeyUrl);
                    if (claves && claves.keys?.length > 0) {
                        const kidHex = base64AHex(claves.keys[0].kid);
                        const keyHex = base64AHex(claves.keys[0].k);
                        shakaPlayer.configure({ drm: { clearKeys: { [kidHex]: keyHex } } });
                        console.log("✅ DRM:", canal.name);
                    }
                }

                await shakaPlayer.load(URL_COMPLETA);
                video.style.display = 'block';
                ocultarSinSenal();
                await video.play().catch(() => video.muted = true);
                reproduciendoOk = true;
                console.log("✅ Reproduciendo:", canal.name);
            } catch (err) {
                console.error("❌ Error DASH:", err);
                mostrarSinSenal();
            }
        }

        function reproducirCanalHLS(canal) {
            const url = canal.url;
            console.log("📡 HLS:", canal.name, "→", url);
            reproduciendoOk = false;
            canalActual = canal;
            mostrarSinSenal();
            limpiarReproductor();

            if (window.Hls && Hls.isSupported()) {
                const hls = new Hls({ maxBufferLength: 15, enableWorker: false });
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.style.display = 'block';
                    video.play().catch(() => video.muted = true);
                    ocultarSinSenal();
                    reproduciendoOk = true;
                });
                hls.on(Hls.Events.ERROR, (evt, data) => { if (data.fatal) mostrarSinSenal(); });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', () => {
                    video.style.display = 'block';
                    video.play().catch(() => video.muted = true);
                    ocultarSinSenal();
                    reproduciendoOk = true;
                });
                video.addEventListener('error', mostrarSinSenal);
            }
        }

        function mostrarSinSenal() { sinSenal.classList.remove('oculto'); }
        function ocultarSinSenal() { sinSenal.classList.add('oculto'); }
        function limpiarReproductor() {
            if (shakaPlayer) { shakaPlayer.unload(); shakaPlayer.destroy(); shakaPlayer = null; }
            video.pause(); video.removeAttribute('src'); video.load(); video.style.display = 'none'; canalActual = null;
        }
        function actualizarHora() {
            const h = new Date();
            document.querySelector('.hora').textContent = `${h.getHours().toString().padStart(2,'0')}:${h.getMinutes().toString().padStart(2,'0')}`;
        }
        actualizarHora(); setInterval(actualizarHora, 60000);

        function generarTarjetas() {
            listaScrollEl.innerHTML = '';
            CHANNELS.forEach((ch, idx) => {
                const esDASH = ch.tipo === 'dash';
                const div = document.createElement('div');
                div.className = 'tarjeta-canal';
                div.tabIndex = 0;
                div.dataset.index = idx;

                const numero = document.createElement('span');
                numero.className = 'numero-canal';
                numero.textContent = ch.num;

                const logo = document.createElement('div');
                logo.className = 'logo-canal';
                if (ch.logo) {
                    const img = document.createElement('img');
                    img.src = ch.logo;
                    img.alt = '';
                    img.loading = 'lazy';
                    img.onerror = () => { logo.innerHTML = ''; logo.textContent = ch.name.slice(0,2); };
                    logo.appendChild(img);
                } else { logo.textContent = ch.name.slice(0,2); }

                const info = document.createElement('div');
                info.className = 'info-canal';
                const nombre = document.createElement('span');
                nombre.className = 'nombre-canal';
                nombre.textContent = ch.name;
                const subtitulo = document.createElement('span');
                subtitulo.className = 'subtitulo-canal';
                subtitulo.textContent = esDASH ? 'DASH + DRM' : 'En vivo';
                info.appendChild(nombre);
                info.appendChild(subtitulo);

                const chevron = document.createElement('span');
                chevron.className = 'chevron-canal';
                chevron.textContent = '›';

                div.appendChild(numero);
                div.appendChild(logo);
                div.appendChild(info);
                div.appendChild(chevron);

                div.onclick = () => {
                    document.querySelectorAll('.tarjeta-canal').forEach(t => t.classList.remove('seleccionado'));
                    div.classList.add('seleccionado');
                    if (esDASH && ch.ruta) reproducirCanalDASH(ch);
                    else if (ch.url) reproducirCanalHLS(ch);
                    if (document.body.classList.contains('fullscreen-activo')) listaCanalesEl.classList.remove('visible');
                };
                listaScrollEl.appendChild(div);
            });
        }

        function solicitarPantallaCompleta() {
            if (!document.fullscreenElement) {
                const el = document.documentElement;
                const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
                if (req) req.call(el).catch(() => {});
            }
        }
        document.getElementById('btn-full').onclick = () => {
            if (!document.fullscreenElement) solicitarPantallaCompleta();
            else document.exitFullscreen();
        };
        document.addEventListener('fullscreenchange', () => {
            document.body.classList.toggle('fullscreen-activo', !!document.fullscreenElement);
        });
        let clickTimer = null;
        areaCentral.addEventListener('click', () => {
            if (!document.body.classList.contains('fullscreen-activo')) return;
            clearTimeout(clickTimer);
            clickTimer = setTimeout(() => listaCanalesEl.classList.toggle('visible'), 300);
        });
        areaCentral.addEventListener('dblclick', () => {
            clearTimeout(clickTimer);
            if (!document.fullscreenElement) solicitarPantallaCompleta();
            else document.exitFullscreen();
        });
        document.getElementById('btn-salir-panel').onclick = () => {
            listaCanalesEl.classList.remove('visible');
            if (document.fullscreenElement) document.exitFullscreen();
        };
        if (inputBusqueda) {
            inputBusqueda.addEventListener('input', () => {
                const t = inputBusqueda.value.trim().toLowerCase();
                document.querySelectorAll('.tarjeta-canal').forEach((c, i) => {
                    const n = c.querySelector('.nombre-canal')?.textContent.toLowerCase() || '';
                    c.style.display = (!t || n.includes(t) || String(i+1) === t) ? 'flex' : 'none';
                });
            });
        }
        document.querySelectorAll('.opcion-menu').forEach(m => {
            m.onclick = () => {
                const d = m.dataset.href;
                if (d) window.location.href = d + '.html';
                document.querySelectorAll('.opcion-menu').forEach(i => i.classList.remove('activo'));
                m.classList.add('activo');
            };
        });

        document.addEventListener('DOMContentLoaded', () => {
            console.log('[LUMIX TV] ✅ Configuración cargada —', CHANNELS.length, 'canales');
            generarTarjetas();
            
            const params = new URLSearchParams(window.location.search);
            const canalUrl = (params.get('canal') || 'TELEFUTURO').toUpperCase();
            
            setTimeout(() => {
                const canal = CHANNELS.find(c => c.name.toUpperCase() === canalUrl) || CHANNELS.find(c => c.id?.toUpperCase() === canalUrl) || CHANNELS[0];
                if (canal) {
                    const idx = CHANNELS.indexOf(canal);
                    const tarjetas = document.querySelectorAll('.tarjeta-canal');
                    if (tarjetas[idx]) tarjetas[idx].classList.add('seleccionado');
                    if (canal.tipo === 'dash' && canal.ruta) reproducirCanalDASH(canal);
                    else if (canal.url) reproducirCanalHLS(canal);
                }
            }, 300);
        });
    </script>
</body>
</html>
